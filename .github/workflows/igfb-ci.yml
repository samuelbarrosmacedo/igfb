name: IGFB - validação contínua
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar módulos
        run: python -m compileall -q igfb_agent tests
      - name: Executar todos os testes
        run: python -m unittest discover -s tests -v
      - name: Verificar calendário e pistas
        run: |
          python -m igfb_agent.baseline_report
          python -m igfb_agent.candidates
          python -m igfb_agent.review_queue
          python -m igfb_agent.source_readiness
          python -m igfb_agent.project_audit
          python -m igfb_agent.evidence_inventory config/evidence_inventory.json --root .
          python -m igfb_agent.evidence_reconciliation
          python -m igfb_agent.research_backlog
          python -m igfb_agent.research_report --output /tmp/igfb-research-plan.md
          python -m igfb_agent.research_report --format csv --output /tmp/igfb-research-plan.csv
      - name: Validar exportação pública do frontend
        run: |
          python -m igfb_agent.public_export --output /tmp/igfb-public-data
          python -c "from igfb_agent.public_export import verify_public_data; assert verify_public_data('/tmp/igfb-public-data')"
      - name: Publicar relatórios para auditoria
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: igfb-audit-reports
          retention-days: 14
          path: |
            /tmp/igfb-research-plan.md
            /tmp/igfb-research-plan.csv
            /tmp/igfb-public-data/
          if-no-files-found: error
