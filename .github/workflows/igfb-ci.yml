name: IGFB - validação contínua
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar módulos
        run: python -m compileall -q igfb_agent tests
      - name: Executar todos os testes
        run: python -m unittest discover -s tests -v
      - name: Verificar calendário e pistas
        run: |
          python -m igfb_agent.baseline_report
          python -m igfb_agent.candidates
          python -m igfb_agent.review_queue
          python -m igfb_agent.source_readiness
          python -m igfb_agent.project_audit
      - name: Validar exportação pública do frontend
        run: |
          python -m igfb_agent.public_export --output /tmp/igfb-public-data
          python -c "import json,pathlib; p=pathlib.Path('/tmp/igfb-public-data'); m=json.loads((p/'manifest.json').read_text()); assert all((p/f).is_file() for f in m['files']); r=json.loads((p/'ranking.json').read_text()); assert r['ranking']==[] and r['approved_results']==0"
