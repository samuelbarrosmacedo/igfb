name: IGFB - coleta experimental
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igfb-research-main
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Coletar fontes
        env:
          IGFB_FETCH_LIMIT: '2'
        run: python -m igfb_agent
      - name: Salvar checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m 'data: checkpoint experimental'
            git push
          fi
