name: IGFB - coleta experimental
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: igfb-research-main
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q igfb_agent
      - name: Coletar fontes pendentes
        env:
          IGFB_FETCH_LIMIT: '2'
          IGFB_GEMINI_ENABLED: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m igfb_agent
      - name: Persistir somente mudanças reais
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m 'data: checkpoint experimental'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
